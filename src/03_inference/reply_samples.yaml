# Bank kịch bản reply TĨNH cho các nhánh ack (không cần knowledge layer).
#
# Module: inference.draft (B2) — nguồn copy song ngữ cho respond.py.
# Architecture: docs/architecture.md §4.3 (ack_only: praise→acknowledge, complaint→apology,
#   unclassified→ack trung tính).
# Impl: docs/impl-phase2-auto-feedback-flow.md §5 (nhánh ack bỏ RAG + backlog).
# Template rule: template/skill_create_email.md (song ngữ VI/EN, KHÔNG em-dash, KHÔNG emoji,
#   giọng ấm/tự nhiên, viết đúng "TÀI Studio").
#
# 3 nhóm khớp mapping trong respond.py:
#   thank_you   ← praise      (ack_only, không tiêu cực)
#   apology     ← complaint   (ack_only, tiêu cực)
#   neutral_ack ← unclassified (dưới ngưỡng, không đoán nhãn)
#
# Placeholder GIỮ NGUYÊN cho runtime điền: {name} (deliver điền), {feedback_summary} (respond điền).
# PM review/sửa file này trực tiếp; thêm/bớt mẫu là an toàn (picker chọn theo hash % số mẫu).

